<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f0f1a; color: #e0e0e0;
    padding: 16px; min-height: 100vh;
  }
  h2 { font-size: 16px; color: #f59e0b; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #888; margin-bottom: 12px; }
  textarea {
    width: 100%; padding: 10px; border-radius: 8px;
    border: 1px solid #2a2a4a; background: #1a1a2e; color: #e0e0e0;
    font-size: 13px; resize: vertical; min-height: 60px; font-family: inherit;
  }
  textarea:focus { border-color: #f59e0b; outline: none; }
  #examples { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 4px; }
  .example-btn {
    padding: 4px 8px; border-radius: 12px; font-size: 10px;
    background: #1a1a2e; border: 1px solid #2a2a4a; color: #888;
    cursor: pointer; text-align: left;
  }
  .example-btn:hover { border-color: #f59e0b; color: #e0e0e0; }
  #log { margin-top: 12px; max-height: calc(100vh - 260px); overflow-y: auto; scroll-behavior:smooth; overflow-anchor:auto; }
  .entry {
    padding: 6px 10px; margin: 3px 0; border-radius: 6px;
    font-size: 12px; line-height: 1.5;
  }
  .entry.status { background: #1a1a2e; border: 1px solid #2a2a4a; color: #888; }
  .entry.step { background: #1a1a2e; border-left: 3px solid #f59e0b; color: #e0e0e0; }
  .entry.tool-done { background: transparent; color: #666; font-size: 11px; padding: 2px 10px; }
  .entry.result-header { color: #f59e0b; font-weight: 600; margin-top: 8px; }
  .entry.result {
    background: linear-gradient(135deg, #2e1f0a, #1f1505);
    border: 1px solid #f59e0b;
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.6;
  }
  .entry.result h1, .entry.result h2, .entry.result h3 {
    color: #f59e0b; margin: 10px 0 6px 0; font-size: 14px;
  }
  .entry.result h1:first-child, .entry.result h2:first-child, .entry.result h3:first-child {
    margin-top: 0;
  }
  .entry.result p { margin: 6px 0; }
  .entry.result strong { color: #fbbf24; }
  .entry.result ul, .entry.result ol { padding-left: 18px; margin: 6px 0; }
  .entry.result li { margin: 2px 0; }
  .entry.result table {
    width: 100%; border-collapse: collapse; margin: 8px 0;
    font-size: 12px;
  }
  .entry.result th {
    background: rgba(245, 158, 11, 0.2); color: #f59e0b;
    padding: 6px 8px; text-align: left;
    border-bottom: 2px solid #f59e0b;
  }
  .entry.result td {
    padding: 5px 8px;
    border-bottom: 1px solid rgba(245, 158, 11, 0.15);
  }
  .entry.result tr:hover td { background: rgba(245, 158, 11, 0.05); }
  .entry.error { background: #2e1a1a; border: 1px solid #ef4444; color: #ef4444; }
  .entry.done { background: #1a1a2e; border: 1px solid #f59e0b; color: #f59e0b; text-align: center; }
  button#btn {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: #f59e0b; color: #0f0f1a; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }
  button#btn:hover { background: #d97706; }
  button#btn:disabled { background: #444; color: #888; cursor: not-allowed; }
  .footer { text-align: center; margin-top: 12px; font-size: 10px; color: #555; }
  .footer a { color: #f59e0b; text-decoration: none; cursor: pointer; }
  .footer a:hover { text-decoration: underline; }
  .bottom-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; padding: 8px 0; border-top: 1px solid #2a2a4a;
    font-size: 10px; color: #555;
  }
  .bottom-bar a { color: #f59e0b; text-decoration: none; cursor: pointer; }
  .bottom-bar a:hover { text-decoration: underline; }
  .clone-btn {
    display: inline-flex; align-items: center; gap: 4px;
    color: #888; font-size: 10px; text-decoration: none; cursor: pointer;
  }
  .clone-btn:hover { color: #e0e0e0; }
  .clone-btn svg { width: 12px; height: 12px; }
</style>
</head>
<body>
  <h2>🔬 Research Agent</h2>
  <p class="sub">Compares data across multiple web pages</p>
  <textarea id="topic" placeholder="e.g. Compare Amsterdam and Rotterdam: population, area, and top attractions">Compare Amsterdam and Rotterdam: population, area, and top attractions</textarea>
  <div id="examples"></div>
  <button id="btn" onclick="startResearch()">🔍 Start Research</button>
  <div id="log"></div>
  <div class="bottom-bar">
    <span>powered by <a data-href="https://webfuse.com" onclick="window.open(this.dataset.href,'_blank')">webfuse</a> + <a data-href="https://python.langchain.com" onclick="window.open(this.dataset.href,'_blank')">langchain</a></span>
    <a class="clone-btn" data-href="https://github.com/hummer-netizen/extension-langchain-mcp" onclick="window.open(this.dataset.href,'_blank')">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      clone it
    </a>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
